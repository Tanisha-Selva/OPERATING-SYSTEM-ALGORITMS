<!DOCTYPE html>
<html>
<head>
  <title>Select Specific Algorithm</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ffe6f0;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        background-color: #fff0f6;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
        width: 100%;
        max-width: 500px;
    }
    h1 {
        color: #d63384;
        margin-bottom: 20px;
    }
    p {
        margin: 10px 0;
        color: #6f2c91;
    }
    select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #f5c2e7;
        border-radius: 4px;
        background-color: #fff;
    }
    button {
        background-color: #d63384;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        margin-top: 15px;
    }
    button:hover {
        background-color: #c2185b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Select Specific Algorithm</h1>
    <div id="selectionArea">
      <!-- JS will populate content here -->
    </div>
  </div>

  <script>
  function runFCFS() {

    const headInput = document.getElementById("head").value.trim();
    const requestInput = document.getElementById("requests").value.trim();
    const output = document.getElementById("output");

    // Validate head position
    if (headInput === "") {
      output.innerText = "Please enter the head position.";
      return;
    }

    const head = Number(headInput);

    if (!Number.isInteger(head) || head < 0) {
      output.innerText = "Head position must be a non-negative integer.";
      return;
    }

    // Validate request queue
    if (requestInput === "") {
      output.innerText = "Please enter the request queue.";
      return;
    }

    const requests = requestInput
      .split(",")
      .map(value => value.trim());

    // Check every request
    for (let value of requests) {
      if (value === "" || !Number.isInteger(Number(value)) || Number(value) < 0) {
        output.innerText =
          "Invalid request queue. Enter non-negative integers separated by commas.";
        return;
      }
    }

    const requestQueue = requests.map(Number);

    // FCFS calculation
    let totalSeek = 0;
    let current = head;
    let sequence = [head];

    for (let request of requestQueue) {

      const seekDistance = Math.abs(current - request);

      totalSeek += seekDistance;

      sequence.push(request);

      current = request;
    }

    // Display result
    const averageSeek = totalSeek / requestQueue.length;

    output.innerText =
      "Seek Sequence: " + sequence.join(" → ") + "\n" +
      "Total Seek Time: " + totalSeek + "\n" +
      "Average Seek Time: " + averageSeek.toFixed(2);
  }
</script>
</body>
</html>
